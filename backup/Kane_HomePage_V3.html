<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANE Magazine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:#141414;--accent:#c9a96e;--text:#f0f0f0;--text-secondary:#888;--border:#2a2a2a}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* ===== ARTISTIC BACKGROUND ===== */
.art-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden}
.art-bg svg{position:absolute;opacity:.04;fill:none;stroke:var(--accent);stroke-width:.5}
.art-bg .violin{top:5%;left:3%;width:280px;height:auto;animation:floatA 25s ease-in-out infinite}
.art-bg .palette{top:15%;right:5%;width:220px;animation:floatB 30s ease-in-out infinite}
.art-bg .mask{bottom:20%;left:8%;width:200px;animation:floatC 28s ease-in-out infinite}
.art-bg .brush{bottom:10%;right:10%;width:260px;animation:floatA 22s ease-in-out infinite reverse}
.art-bg .piano{top:50%;left:50%;transform:translate(-50%,-50%);width:400px;animation:floatB 35s ease-in-out infinite}
.art-bg .figure1{top:60%;right:20%;width:180px;animation:floatC 20s ease-in-out infinite}
.art-bg .figure2{top:30%;left:25%;width:150px;animation:floatA 32s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(15px,-20px) rotate(2deg)}50%{transform:translate(-10px,15px) rotate(-1deg)}75%{transform:translate(20px,10px) rotate(1.5deg)}}
@keyframes floatB{0%,100%{transform:translate(0,0) rotate(0deg)}33%{transform:translate(-20px,15px) rotate(-2deg)}66%{transform:translate(15px,-10px) rotate(1.5deg)}}
@keyframes floatC{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-15px) rotate(3deg)}}

/* Radial glow spots */
.glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}
.glow1{top:-10%;left:-10%;width:500px;height:500px;background:rgba(201,169,110,.06)}
.glow2{bottom:-10%;right:-10%;width:600px;height:600px;background:rgba(110,140,201,.04)}
.glow3{top:40%;left:60%;width:400px;height:400px;background:rgba(201,110,140,.03)}

/* All content above background */
nav,.hero,.filter-section,.magazine-grid,.modal-overlay,footer,.lang-switch{position:relative;z-index:1}

.lang-switch{position:fixed;top:20px;right:20px;z-index:1000;display:flex;gap:6px}
.lang-btn{background:rgba(20,20,20,.8);border:1px solid var(--border);color:var(--text-secondary);padding:6px 14px;cursor:pointer;font-size:13px;transition:all .3s;border-radius:4px;backdrop-filter:blur(10px)}
.lang-btn.active{color:var(--accent);border-color:var(--accent)}
.lang-btn:hover{color:var(--accent)}
nav{position:fixed;top:0;left:0;width:100%;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;z-index:999;background:rgba(10,10,10,.85);backdrop-filter:blur(10px)}
.logo{font-size:18px;font-weight:700;letter-spacing:4px;color:var(--accent)}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 20px;position:relative}
.hero h1{font-size:clamp(48px,10vw,120px);font-weight:200;letter-spacing:12px;text-transform:uppercase;line-height:1.1}
.hero h1 span{color:var(--accent)}
.hero p{margin-top:24px;font-size:18px;color:var(--text-secondary);letter-spacing:3px;max-width:600px}
.hero-line{width:1px;height:80px;background:linear-gradient(to bottom,transparent,var(--accent));margin-top:40px;animation:growLine 2s ease infinite}
@keyframes growLine{0%,100%{opacity:.3;height:60px}50%{opacity:1;height:100px}}
.scroll-indicator{margin-top:16px;color:var(--text-secondary);font-size:12px;letter-spacing:2px}
.filter-section{padding:40px 40px 20px;position:sticky;top:70px;z-index:99;background:rgba(10,10,10,.92);backdrop-filter:blur(10px)}
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--text-secondary);padding:10px 24px;cursor:pointer;font-size:14px;transition:all .3s;border-radius:30px;letter-spacing:1px}
.filter-btn.active,.filter-btn:hover{color:var(--accent);border-color:var(--accent)}
.magazine-grid{padding:40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:30px;max-width:1400px;margin:0 auto}

/* ===== CARD — BULLETPROOF HOVER ===== */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transition:transform .4s ease, box-shadow .4s ease, border-color .4s ease, background .4s ease;
}
.card:hover{
  transform:translateY(-14px) scale(1.03);
  border-color:var(--accent);
  box-shadow:0 30px 80px rgba(201,169,110,.2), 0 0 40px rgba(201,169,110,.08);
  background:#1c1c1c;
}
.card-image{width:100%;height:240px;position:relative;overflow:hidden}
.card-image .gradient-bg{
  width:100%;height:100%;
  transition:transform .5s ease, filter .5s ease;
}
.card:hover .gradient-bg{
  transform:scale(1.2);
  filter:brightness(1.4) saturate(1.3);
}
/* Overlay on hover */
.card-image::after{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(to top,rgba(10,10,10,.7),transparent 60%);
  opacity:0;transition:opacity .4s ease;
}
.card:hover .card-image::after{opacity:1}
/* Arrow button */
.card-readmore{
  position:absolute;bottom:20px;right:20px;
  background:var(--accent);color:#000;
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;
  opacity:0;transform:translateY(15px) scale(.8);
  transition:opacity .4s ease, transform .4s ease;
  z-index:2;
}
.card:hover .card-readmore{
  opacity:1;transform:translateY(0) scale(1);
}
.card-content{padding:28px;transition:background .4s ease}
.card:hover .card-content{background:rgba(201,169,110,.03)}
.card-category{
  display:inline-block;font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--accent);border:1px solid rgba(201,169,110,.4);
  padding:4px 14px;border-radius:20px;margin-bottom:16px;
  transition:all .3s ease;
}
.card:hover .card-category{
  background:var(--accent);color:#000;border-color:var(--accent);
}
.card-title{font-size:22px;font-weight:600;margin-bottom:12px;line-height:1.3;transition:color .3s ease}
.card:hover .card-title{color:var(--accent)}
.card-meta{
  display:flex;justify-content:space-between;align-items:center;
  color:var(--text-secondary);font-size:13px;margin-top:16px;padding-top:16px;
  border-top:1px solid var(--border);
}
.card-author{font-weight:500}
.card-publication{font-style:italic;color:var(--accent);opacity:.7}

/* Shine sweep on hover */
.card::before{
  content:'';position:absolute;top:0;left:-100%;
  width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(201,169,110,.06),transparent);
  transition:left .6s ease;z-index:1;pointer-events:none;
}
.card:hover::before{left:150%}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:2000;display:none;overflow-y:auto;opacity:0;transition:opacity .4s}
.modal-overlay.active{display:block;opacity:1}
.modal-close{position:fixed;top:30px;right:30px;background:rgba(20,20,20,.8);border:1px solid var(--border);color:var(--text);width:50px;height:50px;font-size:24px;cursor:pointer;z-index:2001;border-radius:50%;transition:all .3s;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.modal-close:hover{border-color:var(--accent);color:var(--accent);transform:rotate(90deg)}
.modal-content{max-width:800px;margin:80px auto;padding:60px 40px;animation:modalSlide .5s ease}
@keyframes modalSlide{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.modal-hero{width:100%;height:300px;border-radius:12px;margin-bottom:40px}
.modal-category{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.modal-title{font-size:clamp(32px,5vw,48px);font-weight:300;line-height:1.2;margin-bottom:30px}
.modal-info{display:flex;gap:30px;color:var(--text-secondary);font-size:14px;margin-bottom:40px;padding-bottom:30px;border-bottom:1px solid var(--border)}
.modal-body{font-size:17px;line-height:2;color:#ccc}
.modal-body p{margin-bottom:24px}
footer{border-top:1px solid var(--border);padding:60px 40px;text-align:center;margin-top:80px}
.footer-logo{font-size:24px;font-weight:700;letter-spacing:6px;color:var(--accent);margin-bottom:16px}
.footer-desc{color:var(--text-secondary);font-size:14px;max-width:500px;margin:0 auto 30px}
.footer-links{display:flex;justify-content:center;gap:24px;margin-bottom:30px}
.footer-links a{color:var(--text-secondary);font-size:13px;letter-spacing:1px;transition:color .3s}
.footer-links a:hover{color:var(--accent)}
.footer-legal{color:#555;font-size:12px}
@media(max-width:768px){
  nav{padding:15px 20px}.hero h1{letter-spacing:6px}
  .magazine-grid{padding:20px;grid-template-columns:1fr;gap:20px}
  .card-image{height:200px}.filter-section{padding:20px}
  .filter-bar{gap:8px}.filter-btn{padding:8px 16px;font-size:12px}
  .modal-content{padding:40px 20px;margin:60px auto}
  .modal-info{flex-direction:column;gap:10px}
  .lang-switch{top:15px;right:15px}.lang-btn{padding:4px 10px;font-size:11px}
  .modal-hero{height:180px}
  .art-bg svg{opacity:.02}
}
</style>
</head>

<script>
const gradients=[
  'linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)',
  'linear-gradient(135deg,#2d1b42,#1a1a2e,#16213e)',
  'linear-gradient(135deg,#1b2d2a,#1a2e1a,#213e16)',
  'linear-gradient(135deg,#2e1a1a,#3e1621,#601a0f)',
  'linear-gradient(135deg,#1a2e2e,#162e3e,#0f4560)',
  'linear-gradient(135deg,#2e2e1a,#3e3216,#60450f)'
];
const articles=[
{id:1,category:"criticism",gradient:gradients[0],title:{ko:"베를린 비엔날레에서 만난 디아스포라의 시선",de:"Der Blick der Diaspora auf der Berlin Biennale",en:"Diaspora Perspectives at the Berlin Biennale"},author:{ko:"김서연",de:"Seoyeon Kim",en:"Seoyeon Kim"},publication:{ko:"아트인컬처",de:"Art in Culture",en:"Art in Culture"},date:"2026.05",body:{ko:"<p>제12회 베를린 비엔날레는 디아스포라 예술가들의 목소리를 전면에 내세웠다.</p><p>전시장에 들어서면 가장 먼저 만나게 되는 것은 거대한 설치 작품이다. 천장에서 바닥까지 이어지는 한지 조각들이 바람에 흔들리며, 관객은 마치 기억의 터널을 걷는 듯한 경험을 하게 된다.</p><p>이 작품은 이주와 정착, 그리고 그 사이의 공백에 대한 이야기를 담고 있다.</p>",de:"<p>Die 12. Berlin Biennale stellte die Stimmen der Diaspora-Künstler in den Vordergrund.</p>",en:"<p>The 12th Berlin Biennale brought diaspora artists' voices to the forefront.</p>"}},
{id:2,category:"review",gradient:gradients[1],title:{ko:"함부르크 탈리아 극장, 새로운 한독 협업의 서막",de:"Thalia Theater Hamburg: Auftakt einer deutsch-koreanischen Zusammenarbeit",en:"Thalia Theater Hamburg: Dawn of a Korean-German Collaboration"},author:{ko:"이준혁",de:"Junhyeok Lee",en:"Junhyeok Lee"},publication:{ko:"공연과 리뷰",de:"Performance & Review",en:"Performance & Review"},date:"2026.04",body:{ko:"<p>함부르크 탈리아 극장에서 펼쳐진 한독 협업 공연은 양국 연극의 새로운 가능성을 열었다.</p><p>연출가는 두 문화의 충돌이 아닌 대화를 시도했다.</p>",de:"<p>Die koreanisch-deutsche Koproduktion am Thalia Theater eröffnete neue Möglichkeiten.</p>",en:"<p>The Korean-German collaboration at Thalia Theater opened new possibilities.</p>"}},
{id:3,category:"essay",gradient:gradients[2],title:{ko:"경계에 선 예술가 — 독일에서 한국인으로 창작한다는 것",de:"Künstler an der Grenze — Als Koreaner in Deutschland schaffen",en:"Artists on the Border — Creating as a Korean in Germany"},author:{ko:"박지은",de:"Jieun Park",en:"Jieun Park"},publication:{ko:"문학동네",de:"Munhak Dongne",en:"Munhak Dongne"},date:"2026.03",body:{ko:"<p>독일에 온 지 8년이 지났다. 처음에는 이방인의 시선으로 모든 것이 새로웠다.</p><p>경계에 선다는 것은 양쪽을 모두 볼 수 있다는 뜻이기도 하다.</p>",de:"<p>Acht Jahre sind vergangen, seit ich nach Deutschland gekommen bin.</p>",en:"<p>Eight years have passed since I came to Germany.</p>"}},

let currentLang='ko';
function switchLang(lang){
  currentLang=lang;
  document.querySelectorAll('.lang-btn').forEach(function(b){
    var map={ko:'KR',de:'DE',en:'EN'};
    b.classList.toggle('active',b.textContent.trim()===map[lang]);
  });
  document.querySelectorAll('[data-lang-'+lang+']').forEach(function(el){
    el.textContent=el.getAttribute('data-lang-'+lang);
  });
  renderCards(document.querySelector('.filter-btn.active').dataset.filter);
}
function renderCards(filter){
  var grid=document.getElementById('grid');
  var filtered=filter==='all'?articles:articles.filter(function(a){return a.category===filter});
  var html='';
  for(var i=0;i<filtered.length;i++){
    var a=filtered[i];
    html+='<div class="card visible" data-id="'+a.id+'" style="animation-delay:'+i*0.1+'s">';
    html+='<div class="card-image"><div class="gradient-bg" style="background:'+a.gradient+'"></div>';
    html+='<div class="card-readmore">→</div></div>';
    html+='<div class="card-content"><span class="card-category">'+getCategoryLabel(a.category)+'</span>';
    html+='<h3 class="card-title">'+a.title[currentLang]+'</h3>';
    html+='<div class="card-meta"><span class="card-author">'+a.author[currentLang]+'</span>';
    html+='<span class="card-publication">'+a.publication[currentLang]+'</span>';
    html+='<span>'+a.date+'</span></div></div></div>';
  }
  grid.innerHTML=html;
  // Attach click events
  var cards=grid.querySelectorAll('.card');
  for(var j=0;j<cards.length;j++){
    cards[j].addEventListener('click',function(){
      var id=parseInt(this.getAttribute('data-id'));
      openModal(id);
    });
  }
}
function getCategoryLabel(cat){
  var labels={
    criticism:{ko:'미술비평',de:'Kunstkritik',en:'Art Criticism'},
    review:{ko:'공연리뷰',de:'Aufführungskritik',en:'Performance Review'},
    essay:{ko:'에세이',de:'Essay',en:'Essay'},
    interview:{ko:'인터뷰',de:'Interview',en:'Interview'}
  };
  return labels[cat][currentLang];
}
function openModal(id){
  var a=null;
  for(var i=0;i<articles.length;i++){if(articles[i].id===id){a=articles[i];break;}}
  if(!a)return;
  document.getElementById('modal-hero').style.background=a.gradient;
  document.getElementById('modal-category').textContent=getCategoryLabel(a.category);
  document.getElementById('modal-title').textContent=a.title[currentLang];
  document.getElementById('modal-author').textContent=a.author[currentLang];
  document.getElementById('modal-publication').textContent=a.publication[currentLang];
  document.getElementById('modal-date').textContent=a.date;
  document.getElementById('modal-body').innerHTML=a.body[currentLang];
  var modal=document.getElementById('modal');
  modal.style.display='block';
  setTimeout(function(){modal.classList.add('active');},10);
  document.body.style.overflow='hidden';
}
function closeModal(){
  var modal=document.getElementById('modal');
  modal.classList.remove('active');
  setTimeout(function(){modal.style.display='none';},400);
  document.body.style.overflow='auto';
}
document.querySelectorAll('.filter-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    renderCards(btn.dataset.filter);
  });
});
document.getElementById('modal').addEventListener('click',function(e){
  if(e.target===e.currentTarget)closeModal();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
renderCards('all');
</script>
