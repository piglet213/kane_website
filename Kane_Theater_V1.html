<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANE Magazine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:#141414;--card-hover:#1c1c1c;--accent:#c9a96e;--text:#f0f0f0;--text-secondary:#888;--border:#2a2a2a}
body{background:#0a0a0a url('bg.jpg') center center / cover no-repeat fixed;color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;line-height:1.8;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.bg-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:rgba(0,0,0,0.7)}
.lang-switch{position:fixed;top:20px;right:20px;z-index:1001;display:flex;gap:6px}
.lang-btn{background:rgba(20,20,20,.85);border:1px solid var(--border);color:var(--text-secondary);padding:6px 14px;cursor:pointer;font-size:13px;transition:all .3s;border-radius:4px}
.lang-btn.active{color:var(--accent);border-color:var(--accent)}
.lang-btn:hover{color:var(--accent)}
nav{position:fixed;top:0;left:0;width:100%;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;z-index:1000;background:rgba(10,10,10,.88);backdrop-filter:blur(12px);border-bottom:1px solid rgba(42,42,42,.5)}
.logo{font-size:20px;font-weight:700;letter-spacing:5px;color:var(--accent);cursor:pointer}
.nav-links{display:flex;gap:28px}
.nav-links a{color:var(--text-secondary);font-size:14px;letter-spacing:1px;transition:color .3s;cursor:pointer;position:relative;padding-bottom:4px}
.nav-links a:hover,.nav-links a.active{color:var(--accent)}
.nav-links a.active::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:1px;background:var(--accent)}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 20px;position:relative;z-index:1}
.hero h1{font-size:clamp(48px,10vw,120px);font-weight:200;letter-spacing:12px;text-transform:uppercase;line-height:1.1}
.hero h1 span{color:var(--accent)}
.hero-subtitle{margin-top:24px;font-size:18px;color:var(--text-secondary);letter-spacing:3px;max-width:700px;line-height:1.8}
.hero-line{width:1px;height:80px;background:linear-gradient(to bottom,transparent,var(--accent));margin-top:40px;animation:growLine 2s ease infinite}
@keyframes growLine{0%,100%{opacity:.3;height:60px}50%{opacity:1;height:100px}}
.scroll-indicator{margin-top:16px;color:var(--text-secondary);font-size:12px;letter-spacing:2px}
.filter-section{padding:40px 40px 20px;position:sticky;top:70px;z-index:99;background:rgba(10,10,10,.92);backdrop-filter:blur(10px)}
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--text-secondary);padding:10px 24px;cursor:pointer;font-size:14px;transition:all .3s;border-radius:30px;letter-spacing:1px}
.filter-btn.active,.filter-btn:hover{color:var(--accent);border-color:var(--accent)}
.magazine-grid{padding:40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:30px;max-width:1400px;margin:0 auto;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;position:relative;transition:transform .4s ease,box-shadow .4s ease,border-color .4s ease,background .4s ease}
.card:hover{transform:translateY(-14px) scale(1.03);border-color:var(--accent);box-shadow:0 30px 80px rgba(201,169,110,.2),0 0 40px rgba(201,169,110,.08);background:var(--card-hover)}
.card-image{width:100%;height:240px;position:relative;overflow:hidden}
.card-image .gradient-bg{width:100%;height:100%;transition:transform .5s ease,filter .5s ease}
.card:hover .gradient-bg{transform:scale(1.2);filter:brightness(1.4) saturate(1.3)}
.card-image::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(to top,rgba(10,10,10,.7),transparent 60%);opacity:0;transition:opacity .4s ease}
.card:hover .card-image::after{opacity:1}
.card-readmore{position:absolute;bottom:20px;right:20px;background:var(--accent);color:#000;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;opacity:0;transform:translateY(15px) scale(.8);transition:opacity .4s ease,transform .4s ease;z-index:2}
.card:hover .card-readmore{opacity:1;transform:translateY(0) scale(1)}
.card-content{padding:28px;transition:background .4s ease}
.card:hover .card-content{background:rgba(201,169,110,.03)}
.card-category{display:inline-block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);border:1px solid rgba(201,169,110,.4);padding:4px 14px;border-radius:20px;margin-bottom:16px;transition:all .3s ease}
.card:hover .card-category{background:var(--accent);color:#000;border-color:var(--accent)}
.card-title{font-size:22px;font-weight:600;margin-bottom:12px;line-height:1.3;transition:color .3s ease}
.card:hover .card-title{color:var(--accent)}
.card-meta{display:flex;justify-content:space-between;align-items:center;color:var(--text-secondary);font-size:13px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.card-author{font-weight:500}
.card-publication{font-style:italic;color:var(--accent);opacity:.7}
.card::before{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(201,169,110,.06),transparent);transition:left .6s ease;z-index:3;pointer-events:none}
.card:hover::before{left:150%}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:2000;display:none;overflow-y:auto;opacity:0;transition:opacity .4s}
.modal-overlay.active{display:block;opacity:1}
.modal-close{position:fixed;top:30px;right:30px;background:rgba(20,20,20,.8);border:1px solid var(--border);color:var(--text);width:50px;height:50px;font-size:24px;cursor:pointer;z-index:2001;border-radius:50%;transition:all .3s;display:flex;align-items:center;justify-content:center}
.modal-close:hover{border-color:var(--accent);color:var(--accent);transform:rotate(90deg)}
.modal-content{max-width:800px;margin:80px auto;padding:60px 40px;animation:modalSlide .5s ease}
@keyframes modalSlide{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.modal-hero{width:100%;height:300px;border-radius:12px;margin-bottom:40px}
.modal-category{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.modal-title{font-size:clamp(28px,4vw,44px);font-weight:300;line-height:1.3;margin-bottom:30px}
.modal-info{display:flex;gap:30px;color:var(--text-secondary);font-size:14px;margin-bottom:40px;padding-bottom:30px;border-bottom:1px solid var(--border)}
.modal-body{font-size:17px;line-height:2;color:#ccc}
.modal-body p{margin-bottom:24px}
footer{border-top:1px solid var(--border);padding:60px 40px;text-align:center;position:relative;z-index:1}
.footer-logo{font-size:24px;font-weight:700;letter-spacing:6px;color:var(--accent);margin-bottom:16px}
.footer-desc{color:var(--text-secondary);font-size:14px;max-width:500px;margin:0 auto 30px}
.footer-links{display:flex;justify-content:center;gap:24px;margin-bottom:30px}
.footer-links a{color:var(--text-secondary);font-size:13px;letter-spacing:1px;transition:color .3s}
.footer-links a:hover{color:var(--accent)}
.footer-legal{color:#555;font-size:12px}
@media(max-width:768px){nav{padding:15px 20px}.hero h1{letter-spacing:6px}.magazine-grid{padding:20px;grid-template-columns:1fr;gap:20px}.card-image{height:200px}.filter-section{padding:20px}.filter-bar{gap:8px}.filter-btn{padding:8px 16px;font-size:12px}.modal-content{padding:40px 20px;margin:60px auto}.modal-info{flex-direction:column;gap:10px}.modal-hero{height:180px}.lang-switch{top:15px;right:60px}.lang-btn{padding:4px 10px;font-size:11px}}
</style>
</head>

<script>
var gradients=['linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)','linear-gradient(135deg,#2d1b42,#1a1a2e,#16213e)','linear-gradient(135deg,#1b2d2a,#1a2e1a,#213e16)','linear-gradient(135deg,#2e1a1a,#3e1621,#601a0f)','linear-gradient(135deg,#1a2e2e,#162e3e,#0f4560)','linear-gradient(135deg,#2e2e1a,#3e3216,#60450f)'];
var articles=[
{id:1,category:"criticism",gradient:gradients[0],title:{ko:"\uBCA0\uB97C\uB9B0 \uBE44\uC5D4\uB0A0\uB808\uC5D0\uC11C \uB9CC\uB09C \uB514\uC544\uC2A4\uD3EC\uB77C\uC758 \uC2DC\uC120",de:"Der Blick der Diaspora auf der Berlin Biennale",en:"Diaspora Perspectives at the Berlin Biennale"},author:{ko:"\uAE40\uC11C\uC5F0",de:"Seoyeon Kim",en:"Seoyeon Kim"},publication:{ko:"\uC544\uD2B8\uC778\uCEEC\uCC98",de:"Art in Culture",en:"Art in Culture"},date:"2026.05",body:{ko:"<p>\uC81C12\uD68C \uBCA0\uB97C\uB9B0 \uBE44\uC5D4\uB0A0\uB808\uB294 \uB514\uC544\uC2A4\uD3EC\uB77C \uC608\uC220\uAC00\uB4E4\uC758 \uBAA9\uC18C\uB9AC\uB97C \uC804\uBA74\uC5D0 \uB0B4\uC138\uC6E0\uB2E4.</p>",de:"<p>Die 12. Berlin Biennale stellte die Stimmen der Diaspora-K\u00FCnstler in den Vordergrund.</p>",en:"<p>The 12th Berlin Biennale brought diaspora artists' voices to the forefront.</p>"}},
{id:2,category:"review",gradient:gradients[1],title:{ko:"\uD568\uBD80\uB974\uD06C \uD0C8\uB9AC\uC544 \uADF9\uC7A5, \uC0C8\uB85C\uC6B4 \uD55C\uB3C5 \uD611\uC5C5\uC758 \uC11C\uB9C9",de:"Thalia Theater Hamburg",en:"Thalia Theater Hamburg"},author:{ko:"\uC774\uC900\uD601",de:"Junhyeok Lee",en:"Junhyeok Lee"},publication:{ko:"\uACF5\uC5F0\uACFC \uB9AC\uBDF0",de:"Performance & Review",en:"Performance & Review"},date:"2026.04",body:{ko:"<p>\uD568\uBD80\uB974\uD06C \uD0C8\uB9AC\uC544 \uADF9\uC7A5\uC5D0\uC11C \uD3BC\uCCD0\uC9C4 \uD55C\uB3C5 \uD611\uC5C5 \uACF5\uC5F0.</p>",de:"<p>Die koreanisch-deutsche Koproduktion.</p>",en:"<p>The Korean-German collaboration.</p>"}},
{id:3,category:"essay",gradient:gradients[2],title:{ko:"\uACBD\uACC4\uC5D0 \uC120 \uC608\uC220\uAC00",de:"K\u00FCnstler an der Grenze",en:"Artists on the Border"},author:{ko:"\uBC15\uC9C0\uC740",de:"Jieun Park",en:"Jieun Park"},publication:{ko:"\uBB38\uD559\uB3D9\uB124",de:"Munhak Dongne",en:"Munhak Dongne"},date:"2026.03",body:{ko:"<p>\uB3C5\uC77C\uC5D0 \uC628 \uC9C0 8\uB144\uC774 \uC9C0\uB0AC\uB2E4.</p>",de:"<p>Acht Jahre in Deutschland.</p>",en:"<p>Eight years in Germany.</p>"}},
{id:4,category:"interview",gradient:gradients[3],title:{ko:"\uC778\uD130\uBDF0: \uBB34\uB300\uBBF8\uC220\uAC00 \uCD5C\uC724\uC11C",de:"Interview: Yunseo Choi",en:"Interview: Yunseo Choi"},author:{ko:"\uC815\uD558\uB298",de:"Haneul Jeong",en:"Haneul Jeong"},publication:{ko:"\uC2A4\uD14C\uC774\uC9C0 \uB9E4\uAC70\uC9C4",de:"Stage Magazin",en:"Stage Magazine"},date:"2026.02",body:{ko:"<p><strong>Q:</strong> \uB3C5\uC77C \uBB34\uB300\uBBF8\uC220\uC758 \uB9E4\uB825\uC740?</p>",de:"<p><strong>Q:</strong> Was macht deutsches B\u00FChnenbild attraktiv?</p>",en:"<p><strong>Q:</strong> What makes German stage design attractive?</p>"}},
{id:5,category:"criticism",gradient:gradients[4],title:{ko:"\uCE74\uC140 \uB3C4\uD050\uBA58\uD0C0\uC640 \uC544\uC2DC\uC544 \uD604\uB300\uBBF8\uC220",de:"Documenta und asiatische Kunst",en:"Documenta and Asian Art"},author:{ko:"\uD55C\uB3C4\uC724",de:"Doyun Han",en:"Doyun Han"},publication:{ko:"\uC6D4\uAC04\uBBF8\uC220",de:"Monatliche Kunst",en:"Monthly Art"},date:"2026.01",body:{ko:"<p>\uCE74\uC140 \uB3C4\uD050\uBA58\uD0C0.</p>",de:"<p>Die Documenta.</p>",en:"<p>Documenta.</p>"}},
{id:6,category:"essay",gradient:gradients[5],title:{ko:"\uC5B8\uC5B4 \uB108\uBA38\uC758 \uC608\uC220",de:"Kunst jenseits der Sprache",en:"Art Beyond Language"},author:{ko:"\uC724\uC11C\uC544",de:"Seoa Yun",en:"Seoa Yun"},publication:{ko:"\uC5D0\uC138\uC774\uC2A4\uD2B8",de:"Der Essayist",en:"The Essayist"},date:"2025.12",body:{ko:"<p>\uB3C5\uC77C\uC5B4\uB97C \uBABB\uD558\uB358 \uC2DC\uC808.</p>",de:"<p>Als ich kein Deutsch sprach.</p>",en:"<p>When I couldn't speak German.</p>"}}
];
var currentLang='ko';
function switchLang(lang){
  currentLang=lang;var map={ko:'KR',de:'DE',en:'EN'};
  var btns=document.querySelectorAll('.lang-btn');
  for(var i=0;i<btns.length;i++){if(btns[i].textContent.trim()===map[lang])btns[i].classList.add('active');else btns[i].classList.remove('active');}
  var els=document.querySelectorAll('[data-lang-'+lang+']');
  for(var j=0;j<els.length;j++){var v=els[j].getAttribute('data-lang-'+lang);if(v.indexOf('<')!==-1)els[j].innerHTML=v;else els[j].textContent=v;}
  var af=document.querySelector('.filter-btn.active');if(af)renderCards(af.dataset.filter);
}
function getCategoryLabel(cat){
  var l={criticism:{ko:'\uBBF8\uC220\uBE44\uD3C9',de:'Kunstkritik',en:'Art Criticism'},review:{ko:'\uACF5\uC5F0\uB9AC\uBDF0',de:'Rezension',en:'Performance Review'},essay:{ko:'\uC5D0\uC138\uC774',de:'Essay',en:'Essay'},interview:{ko:'\uC778\uD130\uBDF0',de:'Interview',en:'Interview'}};
  return l[cat][currentLang];
}
function renderCards(filter){
  var grid=document.getElementById('grid');if(!grid)return;
  var filtered=filter==='all'?articles:articles.filter(function(a){return a.category===filter;});
  var html='';
  for(var i=0;i<filtered.length;i++){var a=filtered[i];
    html+='<div class="card" data-id="'+a.id+'"><div class="card-image"><div class="gradient-bg" style="background:'+a.gradient+'"></div><div class="card-readmore">\u2192</div></div><div class="card-content"><span class="card-category">'+getCategoryLabel(a.category)+'</span><h3 class="card-title">'+a.title[currentLang]+'</h3><div class="card-meta"><span class="card-author">'+a.author[currentLang]+'</span><span class="card-publication">'+a.publication[currentLang]+'</span><span>'+a.date+'</span></div></div></div>';
  }
  grid.innerHTML=html;
  var cards=grid.querySelectorAll('.card');
  for(var j=0;j<cards.length;j++){cards[j].addEventListener('click',function(){openModal(parseInt(this.getAttribute('data-id')));});}
}
var fbs=document.querySelectorAll('.filter-btn');
for(var fi=0;fi<fbs.length;fi++){fbs[fi].addEventListener('click',function(){var a=document.querySelectorAll('.filter-btn');for(var k=0;k<a.length;k++)a[k].classList.remove('active');this.classList.add('active');renderCards(this.dataset.filter);});}
function openModal(id){
  var a=null;for(var i=0;i<articles.length;i++){if(articles[i].id===id){a=articles[i];break;}}if(!a)return;
  document.getElementById('modal-hero').style.background=a.gradient;
  document.getElementById('modal-category').textContent=getCategoryLabel(a.category);
  document.getElementById('modal-title').textContent=a.title[currentLang];
  document.getElementById('modal-author').textContent=a.author[currentLang];
  document.getElementById('modal-publication').textContent=a.publication[currentLang];
  document.getElementById('modal-date').textContent=a.date;
  document.getElementById('modal-body').innerHTML=a.body[currentLang];
  var m=document.getElementById('modal');m.style.display='block';setTimeout(function(){m.classList.add('active');},10);document.body.style.overflow='hidden';
}
function closeModal(){var m=document.getElementById('modal');m.classList.remove('active');setTimeout(function(){m.style.display='none';},400);document.body.style.overflow='auto';}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
renderCards('all');
</script>
</body>
</html>
