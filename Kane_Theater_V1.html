<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANE Magazine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:#141414;--card-hover:#1c1c1c;--accent:#c9a96e;--text:#f0f0f0;--text-secondary:#888;--border:#2a2a2a}
body{background:#0a0a0a url('bg.jpg') center center / cover no-repeat fixed;color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;line-height:1.8;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.bg-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:rgba(0,0,0,0.7)}
.lang-switch{position:fixed;top:20px;right:20px;z-index:1001;display:flex;gap:6px}
.lang-btn{background:rgba(20,20,20,.85);border:1px solid var(--border);color:var(--text-secondary);padding:6px 14px;cursor:pointer;font-size:13px;transition:all .3s;border-radius:4px}
.lang-btn.active{color:var(--accent);border-color:var(--accent)}
.lang-btn:hover{color:var(--accent)}
nav{position:fixed;top:0;left:0;width:100%;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;z-index:1000;background:rgba(10,10,10,.88);backdrop-filter:blur(12px);border-bottom:1px solid rgba(42,42,42,.5)}
.logo{font-size:20px;font-weight:700;letter-spacing:5px;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:10px}
.logo img{height:40px}
.nav-links{display:flex;gap:28px}
.nav-links a{color:var(--text-secondary);font-size:14px;letter-spacing:1px;transition:color .3s;cursor:pointer;position:relative;padding-bottom:4px}
.nav-links a:hover,.nav-links a.active{color:var(--accent)}
.nav-links a.active::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:1px;background:var(--accent)}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 20px;position:relative;z-index:1}
.hero h1{font-size:clamp(48px,10vw,120px);font-weight:200;letter-spacing:12px;text-transform:uppercase;line-height:1.1}
.hero h1 span{color:var(--accent)}
.hero-subtitle{margin-top:24px;font-size:18px;color:var(--text-secondary);letter-spacing:3px;max-width:700px;line-height:1.8}
.hero-line{width:1px;height:80px;background:linear-gradient(to bottom,transparent,var(--accent));margin-top:40px;animation:growLine 2s ease infinite}
@keyframes growLine{0%,100%{opacity:.3;height:60px}50%{opacity:1;height:100px}}
.scroll-indicator{margin-top:16px;color:var(--text-secondary);font-size:12px;letter-spacing:2px}
.filter-section{padding:40px 40px 20px;position:sticky;top:70px;z-index:99;background:rgba(10,10,10,.92);backdrop-filter:blur(10px)}
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--text-secondary);padding:10px 24px;cursor:pointer;font-size:14px;transition:all .3s;border-radius:30px;letter-spacing:1px}
.filter-btn.active,.filter-btn:hover{color:var(--accent);border-color:var(--accent)}
.magazine-grid{padding:40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:30px;max-width:1400px;margin:0 auto;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;position:relative;transition:transform .4s ease,box-shadow .4s ease,border-color .4s ease,background .4s ease}
.card:hover{transform:translateY(-14px) scale(1.03);border-color:var(--accent);box-shadow:0 30px 80px rgba(201,169,110,.2),0 0 40px rgba(201,169,110,.08);background:var(--card-hover)}
.card-image{width:100%;height:240px;position:relative;overflow:hidden}
.card-image img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease,filter .5s ease}
.card:hover .card-image img{transform:scale(1.2);filter:brightness(1.2)}
.card-image::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(to top,rgba(10,10,10,.7),transparent 60%);opacity:0;transition:opacity .4s ease}
.card:hover .card-image::after{opacity:1}
.card-readmore{position:absolute;bottom:20px;right:20px;background:var(--accent);color:#000;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;opacity:0;transform:translateY(15px) scale(.8);transition:opacity .4s ease,transform .4s ease;z-index:2}
.card:hover .card-readmore{opacity:1;transform:translateY(0) scale(1)}
.card-content{padding:28px;transition:background .4s ease}
.card:hover .card-content{background:rgba(201,169,110,.03)}
.card-category{display:inline-block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);border:1px solid rgba(201,169,110,.4);padding:4px 14px;border-radius:20px;margin-bottom:16px;transition:all .3s ease}
.card:hover .card-category{background:var(--accent);color:#000;border-color:var(--accent)}
.card-title{font-size:22px;font-weight:600;margin-bottom:12px;line-height:1.3;transition:color .3s ease}
.card:hover .card-title{color:var(--accent)}
.card-meta{display:flex;justify-content:space-between;align-items:center;color:var(--text-secondary);font-size:13px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.card-author{font-weight:500}
.card-publication{font-style:italic;color:var(--accent);opacity:.7}
.card::before{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(201,169,110,.06),transparent);transition:left .6s ease;z-index:3;pointer-events:none}
.card:hover::before{left:150%}
footer{border-top:1px solid var(--border);padding:60px 40px;text-align:center;position:relative;z-index:1}
.footer-logo{font-size:24px;font-weight:700;letter-spacing:6px;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.footer-logo img{height:50px}
.footer-desc{color:var(--text-secondary);font-size:14px;max-width:500px;margin:0 auto 30px}
.footer-links{display:flex;justify-content:center;gap:24px;margin-bottom:30px}
.footer-links a{color:var(--text-secondary);font-size:13px;letter-spacing:1px;transition:color .3s}
.footer-links a:hover{color:var(--accent)}
.footer-legal{color:#555;font-size:12px}
@media(max-width:768px){nav{padding:15px 20px}.hero h1{letter-spacing:6px}.magazine-grid{padding:20px;grid-template-columns:1fr;gap:20px}.card-image{height:200px}.filter-section{padding:20px}.filter-bar{gap:8px}.filter-btn{padding:8px 16px;font-size:12px}.lang-switch{top:15px;right:60px}.lang-btn{padding:4px 10px;font-size:11px}}
</style>
</head>
<body>

</div>

<section class="hero">

  <div class="hero-line"></div>

</section>
<section class="filter-section">
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all" data-lang-ko="전체" data-lang-de="Alle" data-lang-en="All">전체</button>
    <button class="filter-btn" data-filter="essay" data-lang-ko="기고문" data-lang-de="Beitrag" data-lang-en="Article">기고문</button>

    <button class="filter-btn" data-filter="review" data-lang-ko="연수" data-lang-de="Schulung" data-lang-en="Training">연수</button>

  </div>
</section>
<section class="magazine-grid" id="grid"></section>
<footer>
  <div class="footer-logo" style="cursor:pointer" onclick="location.href='Kane_HomePage_V8.html'"><img src="kane-logo.png" alt="KANE"><span>KANE</span></div>
  <p class="footer-desc" data-lang-ko="유럽 내 한인 예술가들의 든든한 연대와 성장을 위한 플랫폼" data-lang-de="Plattform f&#252;r Solidarit&#228;t und Wachstum koreanischer K&#252;nstler in Europa" data-lang-en="Platform for solidarity and growth of Korean artists in Europe">유럽 내 한인 예술가들의 든든한 연대와 성장을 위한 플랫폼</p>

  <p class="footer-legal">&#169; 2026 KANE e.V. | Ulm, Germany | VR 723293 | <a href="#">Datenschutz</a></p>
</footer>
<script>
var articles=[
{id:1,category:"essay",url:"https://shorturl.at/jIPFw",thumb:"thumnail_pic/themove_thumnail.png",title:{ko:"\uBB38\uD654\uAE30\uBCF8\uAD8C\uACFC \uADF9\uC7A5\uC758 \uC9C4\uD654",de:"Kulturelles Grundrecht und die Evolution des Theaters",en:"Cultural Basic Rights and the Evolution of Theater"},author:{ko:"\uC774\uC911\uC6B4",de:"Joongwoon Lee",en:"Joongwoon Lee"},publication:{ko:"\uC6D4\uAC04 \uB354\uBB34\uBE0C",de:"The Move Monthly",en:"The Move Monthly"},date:"2026.01"},
{id:2,category:"interview",url:"https://youtu.be/8hqJqxu-YUM?si=h_dM4TJSfo25G0H5",thumb:"thumnail_pic/YTN_thumnail.png",title:{ko:"\uBE0C\uB77C\uBCF4 \uB9C8\uC774\uB77C\uC774\uD504 \u2014 \uB3C5\uC77C \uC81C\uC791\uADF9\uC7A5\uC758 \uD604\uC7A5",de:"Bravo My Life \u2014 Deutsche Produktionsh\u00E4user",en:"Bravo My Life \u2014 Inside German Production Theaters"},author:{ko:"\uC774\uC9C4\uC625",de:"Jinok Lee",en:"Jinok Lee"},publication:{ko:"YTN",de:"YTN",en:"YTN"},date:"2026.02"},
{id:3,category:"review",url:"https://youtu.be/ZpaOEDYAmLo?si=XYth52e0Tba-BKEJ",thumb:"thumnail_pic/YTN_thumnail2.png",title:{ko:"\uC785\uC2DC \uB300\uC2E0 \uAFC8 \uCC3E\uC544 \u2014 \uACC4\uC6D0\uC608\uACE0 \uB3C5\uC77C \uADF9\uC7A5 \uC5F0\uC218",de:"Tr\u00E4ume statt Pr\u00FCfungen \u2014 Kaewon in Deutschland",en:"Finding Dreams \u2014 Kaewon Arts School in Germany"},author:{ko:"KANE",de:"KANE",en:"KANE"},publication:{ko:"YTN",de:"YTN",en:"YTN"},date:"2026.05"},
{id:4,category:"criticism",url:"https://shorturl.at/PiRGZ",thumb:"thumnail_pic/Lee_thumnail.png",title:{ko:"\uBB38\uD654 \uBB38\uD131 \uB0AE\uCD98 \uB3C5\uC77C\uC758 \uC81C\uC791\uADF9\uC7A5 \uC2DC\uC2A4\uD15C",de:"Deutschlands Produktionstheater senken die Kulturschwelle",en:"Germany's Production Theaters Lowering the Cultural Threshold"},author:{ko:"KANE",de:"KANE",en:"KANE"},publication:{ko:"\uC911\uC559\uC77C\uBCF4",de:"JoongAng Ilbo",en:"JoongAng Ilbo"},date:"2026.05"}
];
var currentLang='ko';
function switchLang(lang){
  currentLang=lang;var map={ko:'KR',de:'DE',en:'EN'};
  var btns=document.querySelectorAll('.lang-btn');
  for(var i=0;i<btns.length;i++){if(btns[i].textContent.trim()===map[lang])btns[i].classList.add('active');else btns[i].classList.remove('active');}
  var els=document.querySelectorAll('[data-lang-'+lang+']');
  for(var j=0;j<els.length;j++){var v=els[j].getAttribute('data-lang-'+lang);if(v.indexOf('<')!==-1)els[j].innerHTML=v;else els[j].textContent=v;}
  var af=document.querySelector('.filter-btn.active');if(af)renderCards(af.dataset.filter);
}
function getCategoryLabel(cat){
  var l={criticism:{ko:'\uC0AC\uC124',de:'Leitartikel',en:'Editorial'},review:{ko:'\uC5F0\uC218',de:'Schulung',en:'Training'},essay:{ko:'\uAE30\uACE0\uBB38',de:'Beitrag',en:'Article'},interview:{ko:'\uBC29\uC1A1',de:'Sendung',en:'Broadcast'}};
  return l[cat][currentLang];
}
function renderCards(filter){
  var grid=document.getElementById('grid');if(!grid)return;
  var filtered=filter==='all'?articles:articles.filter(function(a){return a.category===filter;});
  var html='';
  for(var i=0;i<filtered.length;i++){var a=filtered[i];
    html+='<div class="card" data-url="'+a.url+'"><div class="card-image"><img src="'+a.thumb+'" alt="'+a.title[currentLang]+'"><div class="card-readmore">\u2192</div></div><div class="card-content"><span class="card-category">'+getCategoryLabel(a.category)+'</span><h3 class="card-title">'+a.title[currentLang]+'</h3><div class="card-meta"><span class="card-author">'+a.author[currentLang]+'</span><span class="card-publication">'+a.publication[currentLang]+'</span><span>'+a.date+'</span></div></div></div>';
  }
  grid.innerHTML=html;
  var cards=grid.querySelectorAll('.card');
  for(var j=0;j<cards.length;j++){cards[j].addEventListener('click',function(){window.open(this.getAttribute('data-url'),'_blank');});}
}
var fbs=document.querySelectorAll('.filter-btn');
for(var fi=0;fi<fbs.length;fi++){fbs[fi].addEventListener('click',function(){var a=document.querySelectorAll('.filter-btn');for(var k=0;k<a.length;k++)a[k].classList.remove('active');this.classList.add('active');renderCards(this.dataset.filter);});}
renderCards('all');
</script>
